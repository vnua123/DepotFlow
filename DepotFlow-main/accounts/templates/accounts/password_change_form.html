{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Change Password - DepotFlow{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Change Password</h1>
<div class="bg-white p-6 rounded shadow max-w-sm">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="mt-4 bg-slate-800 text-white px-4 py-2 rounded text-sm hover:bg-slate-700">
            Change Password
        </button>
    </form>
</div>
{% endblock %}
