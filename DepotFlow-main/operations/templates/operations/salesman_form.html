{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }} - DepotFlow{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">{{ title }}</h1>
<div class="bg-white p-6 rounded shadow max-w-lg">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="mt-4 bg-slate-800 text-white px-4 py-2 rounded text-sm hover:bg-slate-700">
            Save
        </button>
        <a href="{% url 'operations:salesman_list' %}" class="ml-2 text-sm text-gray-600 hover:underline">Cancel</a>
    </form>
</div>
{% endblock %}
