{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log in - DepotFlow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-xl font-semibold mb-4">Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="mt-4 w-full bg-slate-800 text-white py-2 rounded hover:bg-slate-700">
            Log in
        </button>
    </form>
</div>
{% endblock %}
